<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calculadora">
<h1>Calculadora</h1>
<output id="visor" aria-live="polite">0</output>
<div class="teclas">
<button data-acao="limpar" class="limpar">AC</button><button data-acao="apagar">⌫</button><button data-op="/">÷</button>
<button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button data-op="*">×</button><button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button data-op="-">-</button><button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button data-op="+">+</button>
<button data-num="0">0</button><button data-num=".">,</button><button data-acao="igual" class="igual">=</button>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
