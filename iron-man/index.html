<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Man — Missão Stark</title><style>*{box-sizing:border-box}body{margin:0;background:#16090b;color:#ffe8bb;font:16px system-ui;text-align:center}main{max-width:760px;margin:auto;padding:16px}h1{color:#e9b650}canvas{width:100%;max-width:700px;background:#10090f;border:2px solid #a92b32;border-radius:12px;touch-action:none}button{background:#a92b32;color:white;border:1px solid #e9b650;border-radius:8px;padding:14px;margin:4px;font:bold 16px system-ui;touch-action:none}a{color:#e9b650}p{margin:10px}</style><main><h1>IRON MAN · MISSÃO STARK</h1><p id="hud">JARVIS ONLINE</p><canvas id="game" width="700" height="440" aria-label="Jogo de combate contra drones"></canvas><div><button id="left">◀</button><button id="fire">DISPARAR</button><button id="right">▶</button><button id="start">Iniciar / Reiniciar</button></div><p>Setas ou A/D para mover · Espaço para disparar</p><a href="https://github.com/gabrielsantogtr">Voltar ao perfil</a></main><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),hud=document.querySelector('#hud');let x=350,score=0,hp=3,record=0,shots=[],enemies=[],keys={},running=false,last=0,spawn=0,cool=0;try{record=Number(localStorage.getItem('starkRecord'))||0}catch{}
function start(){x=350;score=0;hp=3;shots=[];enemies=[];spawn=0;cool=0;running=true;last=performance.now()}
document.querySelector('#start').onclick=start;
const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',' ':'fire'};addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}});addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});addEventListener('blur',()=>keys={});for(const k of ['left','right','fire']){const b=document.getElementById(k);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[k]=false}
function draw(){g.fillStyle='#10090f';g.fillRect(0,0,700,440);g.strokeStyle='#38202b';for(let i=0;i<700;i+=40){g.beginPath();g.moveTo(i,0);g.lineTo(i,440);g.stroke()}for(let i=0;i<440;i+=40){g.beginPath();g.moveTo(0,i);g.lineTo(700,i);g.stroke()}g.save();g.translate(x,390);g.fillStyle='#b91c2b';g.fillRect(-18,-8,36,30);g.fillRect(-27,-5,8,25);g.fillRect(19,-5,8,25);g.fillStyle='#e9b650';g.fillRect(-12,-29,24,23);g.fillStyle='#d5fbff';g.fillRect(-9,-23,7,3);g.fillRect(2,-23,7,3);g.beginPath();g.arc(0,5,7,0,Math.PI*2);g.fill();g.restore();g.fillStyle='#7eefff';for(const s of shots)g.fillRect(s.x-3,s.y,6,15);for(const e of enemies){g.fillStyle='#9b243b';g.fillRect(e.x-20,e.y-12,40,24);g.fillStyle='#ff6574';g.fillRect(e.x-29,e.y-5,58,8);g.fillStyle='#ffe8bb';g.fillRect(e.x-5,e.y-4,10,8)}if(!running){g.fillStyle='#000b';g.fillRect(0,0,700,440);g.fillStyle='#e9b650';g.font='bold 30px system-ui';g.textAlign='center';g.fillText(hp?'MISSÃO STARK':'MISSÃO ENCERRADA',350,190);g.font='18px system-ui';g.fillText('Clique em Iniciar / Reiniciar',350,230)}hud.textContent='Pontos: '+score+' | Vidas: '+hp+' | Recorde: '+record}
function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(running){x=Math.max(30,Math.min(670,x+((keys.right?1:0)-(keys.left?1:0))*340*dt));cool-=dt;if(keys.fire&&cool<=0){shots.push({x,y:355});cool=.18}spawn-=dt;if(spawn<=0){enemies.push({x:35+Math.random()*630,y:-20});spawn=Math.max(.35,1.1-score/800)}for(const s of shots)s.y-=440*dt;for(const e of enemies)e.y+=(85+Math.min(score,600)/5)*dt;for(const e of enemies){for(const s of shots){if(!e.dead&&!s.dead&&Math.abs(e.x-s.x)<23&&Math.abs(e.y-s.y)<20){e.dead=s.dead=true;score+=10}}if(!e.dead&&e.y>365){e.dead=true;hp--}}shots=shots.filter(s=>!s.dead&&s.y>-20);enemies=enemies.filter(e=>!e.dead);if(score>record){record=score;try{localStorage.setItem('starkRecord',record)}catch{}}if(hp<=0){hp=0;running=false}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
