name: JARVIS - Contribution Snake
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snake.yml'
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gabrielsantogtr
          outputs: dist/snake.svg?color_snake=%23d5a347&color_dots=%23321014,%237f1d1d,%23b91c2b,%23ef4444,%23f4c56e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
